spring.application.name=backend

# Database configuration - use environment variables for production
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/badgersublease}
spring.datasource.username=${DATABASE_USERNAME:myuser}
spring.datasource.password=${DATABASE_PASSWORD:secret}

# File upload configuration
spring.servlet.multipart.max-file-size=10MB

# AWS S3 configuration - use environment variables for production
aws.accessKeyId=${AWS_ACCESS_KEY_ID:dummy}
aws.secretKey=${AWS_SECRET_ACCESS_KEY:dummy}
aws.s3.bucket=${AWS_S3_BUCKET_NAME:apartment-pictures-s3-bucket}
aws.region=${AWS_REGION:us-east-1}
aws.cloudfront.domain=${AWS_CLOUDFRONT_DOMAIN}

# CORS configuration - set your production frontend URL
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://badgersublease.com,https://www.badgersublease.com}

# Production logging
logging.level.com.badgersublease=INFO
logging.level.root=WARN

# JPA/Hibernate configuration for production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

firebase.service-account.base64=${FIREBASE_SERVICE_ACCOUNT_KEY_BASE64:local}

ADMIN_UID=${ADMIN_UID}
ADMIN_PASSWORD=${ADMIN_PASSWORD}

# Encryption key for messages (32 bytes, base64 encoded)
encryption.key=${MESSAGE_ENCRYPTION_KEY}

# --- EMAIL CONFIGURATION ---
resend.api-key=${RESEND_API_KEY}
madlease.noreply.email=${MADLEASE_NOREPLY_EMAIL}
madlease.support.email=${MADLEASE_SUPPORT_EMAIL}
madlease.unsubscribe.secret=${UNSUBSCRIBE_SECRET}
madlease.mailing-address=${MADLEASE_MAILING_ADDRESS}

# Slack configuration
slack.webhook.url=${SLACK_WEBHOOK_URL}

